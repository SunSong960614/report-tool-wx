<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="合并不同年龄段测评报告，生成学校学生素养测评数据分析报告">
  <title>学校测评报告合成工具</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>学校测评报告合成工具</h1>
        <p>学生素养测评数据分析</p>
      </div>
    </div>
    <div class="local-status"><span></span>文件不留存</div>
  </header>

  <main class="workspace">
    <section class="work-panel" aria-labelledby="upload-title">
      <div class="section-heading">
        <div><span class="step">01</span><h2 id="upload-title">上传年龄段报告</h2></div>
        <span class="section-note">2-8 份，仅支持 .docx</span>
      </div>

      <label class="dropzone" id="dropzone" for="file-input">
        <input id="file-input" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" multiple>
        <span class="upload-symbol" aria-hidden="true">↑</span>
        <strong>拖入报告，或点击选择文件</strong>
        <span>单个文件建议不超过 20MB，可一次选择多份</span>
      </label>

      <div id="file-list" class="file-list" aria-live="polite">
        <div class="empty-state">尚未添加报告</div>
      </div>
    </section>

    <aside class="side-panel">
      <section class="settings" aria-labelledby="settings-title">
        <div class="section-heading compact">
          <div><span class="step">02</span><h2 id="settings-title">报告信息</h2></div>
        </div>
        <label class="field">
          <span>学校名称 <b>*</b></span>
          <input id="school" type="text" maxlength="60" placeholder="例如：XXX学校" autocomplete="organization">
        </label>
        <label class="field">
          <span>报告年度</span>
          <input id="year" type="number" min="2000" max="2100">
        </label>
      </section>

      <section class="summary" aria-labelledby="summary-title">
        <div class="section-heading compact">
          <div><span class="step">03</span><h2 id="summary-title">汇总预览</h2></div>
        </div>
        <dl class="metrics">
          <div><dt>年龄段</dt><dd id="metric-groups">0</dd></div>
          <div><dt>有效样本</dt><dd id="metric-samples">--</dd></div>
          <div><dt>整体平均分</dt><dd id="metric-mean">--</dd></div>
          <div><dt>整体达标率</dt><dd id="metric-pass">--</dd></div>
        </dl>
        <div id="validation" class="validation">请先上传至少两份年龄段报告</div>
        <button id="generate" class="primary-button" type="button" disabled>
          <span id="button-label">生成学校报告</span>
          <span class="button-arrow" aria-hidden="true">→</span>
        </button>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <datalist id="age-options">
    <option value="一二年级"><option value="三四年级"><option value="五六年级">
    <option value="小学低年级"><option value="小学中年级"><option value="小学高年级">
    <option value="初中"><option value="高中">
  </datalist>
  <script src="/app.js"></script>
</body>
</html>
